[global]
line-length = 120
respect-gitignore = true
disable = ["MD033"]
exclude = [
  "**/skills/",
]

[MD013]
line-length = 120
length-mode = "visual"
reflow = true
reflow-mode = "semantic-line-breaks"
code-blocks = false
tables = false
ignore-link-urls = true
reflow-length-exemptions = true

[MD029]
style = "ordered"

[MD046]
style = "fenced"

[MD048]
style = "backtick"

[MD049]
style = "asterisk"

[MD050]
style = "asterisk"

[MD055]
style = "leading_and_trailing"

[MD060]
enabled = true
style = "aligned"
