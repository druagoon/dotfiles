# ============================================================
# Mobile-friendly format
# MP4 + H.264/AVC + AAC
# ============================================================

# yt-dlp built-in MP4 preset:
# prefers H.264 video and AAC audio, and outputs MP4
-t mp4


# ============================================================
# Output
# ============================================================

-o "%(title)s [%(id)s].%(ext)s"

# Download directory
-P "~/Downloads/Videos"

# Avoid characters problematic across Android/iOS/Windows/NAS
--windows-filenames


# ============================================================
# Metadata / cover
# ============================================================

--embed-metadata
--embed-chapters
--embed-thumbnail
--convert-thumbnails png


# ============================================================
# Subtitles
# ============================================================

--write-subs
--write-auto-subs
--sub-langs "zh-Hans,zh-Hant,zh.*,en.*,en"
# --embed-subs
--convert-subs srt


# ============================================================
# Network
# ============================================================

-N 4
--retries 10
--fragment-retries 10
--socket-timeout 30
--file-access-retries 3


# ============================================================
# File handling
# ============================================================

--continue
--no-overwrites
--mtime
