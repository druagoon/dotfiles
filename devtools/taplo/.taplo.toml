## https://taplo.tamasfe.dev/configuration/file.html

exclude = [
  "**/.git/**",
  "**/.idea/**",
  "**/.venv/**",
  "**/.vscode/**",
  "**/node_modules/**",
  "**/target/**",
]

[formatting]
allowed_blank_lines = 1
array_auto_collapse = false
indent_string = "  "

[[rule]]
include = ["**/.taplo.toml", "**/taplo.toml"]
keys = ["exclude", "formatting", "include", "rule"]

[rule.formatting]
reorder_arrays = true
reorder_keys = true

[[rule]]
include = ["**/Cargo.toml"]
keys = [
  "build-dependencies",
  "dependencies",
  "dev-dependencies",
  "workspace.dependencies",
  "target.*.dependencies",
]

[rule.formatting]
reorder_arrays = true
reorder_keys = true

[[rule]]
include = ["**/pyproject.toml"]
keys = [
  "dependency-groups",
  "project.dependencies",
]

[rule.formatting]
reorder_arrays = true
reorder_keys = true
